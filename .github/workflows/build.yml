name: Build MHOUTLINE

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'
          cache-disabled: false

      - name: Build
        run: gradle clean build --no-daemon --stacktrace

      - name: Locate installable JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhoutline-0.1.0-${{ github.sha }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 14
